x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: event-booking-api-php
  volumes:
    - .:/var/www/html
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *php

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --timeout=60
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-event_booking}
      POSTGRES_USER: ${DB_USERNAME:-event_booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/create-testing-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
